<header class="cabecera">
  <a class="marca" routerLink="/">Abathur</a>

  <nav aria-label="Navegación principal">
    <a routerLink="/" routerLinkActive="activo" [routerLinkActiveOptions]="{ exact: true }">Inicio</a>
    <a routerLink="/articulos" routerLinkActive="activo">Artículos</a>
    <a routerLink="/propuestas" routerLinkActive="activo">Propuestas</a>
    <a routerLink="/categorias" routerLinkActive="activo">Categorías</a>
    <ng-container *appHasRole="'admin'">
      <a routerLink="/admin" routerLinkActive="activo">Admin</a>
    </ng-container>
  </nav>

  <div class="sesion">
    @if (auth.usuario(); as usuario) {
      <span class="usuario">{{ usuario.alias }} · {{ usuario.role }}</span>
      <button type="button" class="salir" (click)="salir()">Salir</button>
    }
  </div>
</header>

<main class="contenido">
  <router-outlet />
</main>
