<section class="pantalla">
  <header class="encabezado">
    <h1>{{ tituloPantalla }}</h1>
    <p class="ayuda">Propuestas de la comunidad. Esqueleto de {{ codigoTicket }}.</p>
  </header>

  @switch (estado.status) {
    @case ('loading') {
      <p class="estado-carga">Cargando propuestas…</p>
    }
    @case ('error') {
      <app-aviso-no-disponible
        [nombrePantalla]="tituloPantalla"
        [codigoTicket]="codigoTicket"
        [error]="estado.error"
      />
    }
    @case ('ready') {
      <p class="estado-carga">Acá irá el listado filtrado por estado de propuesta.</p>
    }
  }
</section>
